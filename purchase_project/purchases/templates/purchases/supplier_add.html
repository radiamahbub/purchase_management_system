{% extends 'base.html' %}


{% block title %}
    {{title}}
{% endblock title %}
    

{% block content %}

<h1 class="text-center m-3">Supplier Info</h1>

<form action="" method="POST">
    {% csrf_token %}

    <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Supplier's name</label>
    <input type="text" name='supplier_name' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Contact Number</label>
    <input type="number" name="contact_number" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Address</label>
    <textarea name="address"  class="form-control" id=""></textarea>
  </div>

</form>
    
{% endblock content %}
