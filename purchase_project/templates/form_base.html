{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block title %}
    {{title}}
{% endblock title %}

{% block content %}

<h1 class="m-4 text-center">{{form_title}}</h1>

<form action="" method="POST">
    
    {% csrf_token %}

    {{form|crispy}}

    <button type="submit" class="btn btn-success">{{form_btn}}</button>
</form>
            
{% endblock content %}
